name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: '密钥别名'
        required: true
        default: 'release-key'
      keystore_password:
        description: '密钥库密码（至少6个字符）'
        required: true
        default: 'appsecret2025'
      key_password:
        description: '密钥密码（至少6个字符）'
        required: true
        default: 'appsecret2025'
      validity_days:
        description: '有效期（天）'
        required: true
        default: '10000'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 生成Keystore
      run: |
        keytool -genkeypair \
          -v \
          -keystore release.jks \
          -alias ${{ github.event.inputs.key_alias }} \
          -keyalg RSA \
          -keysize 2048 \
          -validity ${{ github.event.inputs.validity_days }} \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -keypass ${{ github.event.inputs.key_password }} \
          -dname "CN=App, OU=Development, O=App, L=Beijing, S=Beijing, C=CN"

    - name: 获取SHA1和SHA256签名
      id: get_signatures
      run: |
        echo "=== Keystore 信息 ==="
        keytool -list -v -keystore release.jks \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -alias ${{ github.event.inputs.key_alias }}

        echo ""
        echo "=== 提取签名信息 ==="
        SHA1=$(keytool -list -v -keystore release.jks \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -alias ${{ github.event.inputs.key_alias }} | \
          grep "SHA1:" | sed 's/.*SHA1: //')

        SHA256=$(keytool -list -v -keystore release.jks \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -alias ${{ github.event.inputs.key_alias }} | \
          grep "SHA256:" | sed 's/.*SHA256: //')

        echo "sha1=$SHA1" >> $GITHUB_OUTPUT
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT

    - name: 上传Keystore文件
      uses: actions/upload-artifact@v4
      with:
        name: keystore-files
        path: release.jks
        retention-days: 7

    - name: 📋 配置说明
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🔐 签名证书已生成！"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "SHA1 签名: ${{ steps.get_signatures.outputs.sha1 }}"
        echo "SHA256 签名: ${{ steps.get_signatures.outputs.sha256 }}"
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "⚙️  GitHub Secrets 配置步骤："
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "前往: Settings > Secrets and variables > Actions > New repository secret"
        echo ""
        echo "请从 Artifacts 中下载 keystore-files(release.jks)，转换为 Base64 后配置到 KEYSTORE_FILE："
        echo "  base64 -w 0 release.jks  (Linux)"
        echo "  certutil -encode release.jks tmp.b64  (Windows)"
        echo ""
        echo "创建以下4个Secrets："
        echo "1. 名称: KEYSTORE_FILE (Base64编码后的keystore内容)"
        echo "2. 名称: KEYSTORE_PASSWORD (${{ github.event.inputs.keystore_password }})"
        echo "3. 名称: KEY_ALIAS (${{ github.event.inputs.key_alias }})"
        echo "4. 名称: KEY_PASSWORD (${{ github.event.inputs.key_password }})"
        echo ""
        echo "✅ 配置完成后，即可触发 Release workflow 构建签名APK"
        echo ""
