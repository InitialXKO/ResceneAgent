name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: '密钥别名'
        required: true
        default: 'compassor'
      keystore_password:
        description: '密钥库密码（至少6个字符）'
        required: true
        default: 'compassor2025'
      key_password:
        description: '密钥密码（至少6个字符）'
        required: true
        default: 'compassor2025'
      validity_days:
        description: '有效期（天）'
        required: true
        default: '10000'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 生成Keystore
      run: |
        keytool -genkeypair \
          -v \
          -keystore compassor-release.jks \
          -alias ${{ github.event.inputs.key_alias }} \
          -keyalg RSA \
          -keysize 2048 \
          -validity ${{ github.event.inputs.validity_days }} \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -keypass ${{ github.event.inputs.key_password }} \
          -dname "CN=GrowsNova, OU=Development, O=GrowsNova, L=Beijing, S=Beijing, C=CN"

    - name: 获取SHA1和SHA256签名
      id: get_signatures
      run: |
        echo "=== Keystore 信息 ==="
        keytool -list -v -keystore compassor-release.jks \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -alias ${{ github.event.inputs.key_alias }}

        echo ""
        echo "=== 提取签名信息 ==="
        SHA1=$(keytool -list -v -keystore compassor-release.jks \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -alias ${{ github.event.inputs.key_alias }} | \
          grep "SHA1:" | sed 's/.*SHA1: //')

        SHA256=$(keytool -list -v -keystore compassor-release.jks \
          -storepass ${{ github.event.inputs.keystore_password }} \
          -alias ${{ github.event.inputs.key_alias }} | \
          grep "SHA256:" | sed 's/.*SHA256: //')

        echo "sha1=$SHA1" >> $GITHUB_OUTPUT
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT

    - name: 转换Keystore为Base64
      id: encode
      run: |
        BASE64_KEYSTORE=$(base64 -w 0 compassor-release.jks)
        echo "keystore_base64=$BASE64_KEYSTORE" >> $GITHUB_OUTPUT
        echo "✅ Keystore已转换为Base64"

    - name: 📋 配置说明与Base64输出
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🔐 签名证书已生成！"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "📱 高德地图配置信息："
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "包名 (PackageName): com.growsnova.compassor"
        echo "SHA1 签名: ${{ steps.get_signatures.outputs.sha1 }}"
        echo "SHA256 签名: ${{ steps.get_signatures.outputs.sha256 }}"
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "⚙️  GitHub Secrets 配置步骤："
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "前往: Settings > Secrets and variables > Actions > New repository secret"
        echo ""
        echo "创建以下4个Secrets："
        echo ""
        echo "1. 名称: KEYSTORE_FILE"
        echo "   值: (请在 GitHub Actions 运行页面的 Step Summary 中复制 Base64 字符串)"
        echo ""
        echo "2. 名称: KEYSTORE_PASSWORD"
        echo "   值: ${{ github.event.inputs.keystore_password }}"
        echo ""
        echo "3. 名称: KEY_ALIAS"
        echo "   值: ${{ github.event.inputs.key_alias }}"
        echo ""
        echo "4. 名称: KEY_PASSWORD"
        echo "   值: ${{ github.event.inputs.key_password }}"
        echo ""

        # 写入 Step Summary 方便用户直接在 GitHub Summary 页面上点击复制
        cat << 'EOF' >> $GITHUB_STEP_SUMMARY
        ## 🔐 签名证书生成成功！

        ### 📱 配置信息
        - **包名**: `com.growsnova.compassor`
        - **SHA1**: `${{ steps.get_signatures.outputs.sha1 }}`
        - **SHA256**: `${{ steps.get_signatures.outputs.sha256 }}`

        ### ⚙️ GitHub Secrets 配置说明
        请前往仓库的 **Settings > Secrets and variables > Actions > New repository secret** 创建以下 Secrets：

        1. **KEYSTORE_FILE**: (复制下方框中的 Base64 文本)
        2. **KEYSTORE_PASSWORD**: `${{ github.event.inputs.keystore_password }}`
        3. **KEY_ALIAS**: `${{ github.event.inputs.key_alias }}`
        4. **KEY_PASSWORD**: `${{ github.event.inputs.key_password }}`

        ### 📦 KEYSTORE_FILE (Base64)
        ```text
        EOF
        echo "${{ steps.encode.outputs.keystore_base64 }}" >> $GITHUB_STEP_SUMMARY
        cat << 'EOF' >> $GITHUB_STEP_SUMMARY
        ```
        EOF
