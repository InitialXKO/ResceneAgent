name: Android Release - Build & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write   # 关键：允许创建 Release

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 检查 Gradle 项目
      id: check_gradle
      run: |
        if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
          echo "has_gradle=true" >> $GITHUB_OUTPUT
        else
          echo "has_gradle=false" >> $GITHUB_OUTPUT
          echo "⚠️ 未在根目录下检测到 Gradle 构建文件 (build.gradle / settings.gradle)。"
        fi

    - name: 设置JDK 17
      if: steps.check_gradle.outputs.has_gradle == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 设置Gradle Wrapper
      if: steps.check_gradle.outputs.has_gradle == 'true' && hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') != ''
      uses: gradle/gradle-build-action@v2

    - name: 授予Gradle执行权限
      if: steps.check_gradle.outputs.has_gradle == 'true'
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Check for required secrets
      if: steps.check_gradle.outputs.has_gradle == 'true'
      id: check_secrets
      run: |
        if [ -n "${{ secrets.KEYSTORE_FILE }}" ] && [ -n "${{ secrets.KEYSTORE_ALIAS || secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "result=success" >> $GITHUB_OUTPUT
          echo "has_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "result=failure" >> $GITHUB_OUTPUT
          echo "has_secrets=false" >> $GITHUB_OUTPUT
          echo "Some required secrets are missing." >&2
        fi
      shell: bash

    - name: 配置签名密钥
      if: steps.check_gradle.outputs.has_gradle == 'true' && steps.check_secrets.outputs.has_secrets == 'true'
      run: |
        # 解码base64编码的密钥文件
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > compassor-release.jks || echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > compassor-release.jks

        # 创建keystore.properties
        echo "storeFile=compassor-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: 构建发布版APK
      if: steps.check_gradle.outputs.has_gradle == 'true'
      run: |
        mkdir -p app/build/outputs/apk/release
        GRADLE_CMD="./gradlew"
        if [ ! -f "gradlew" ]; then
          GRADLE_CMD="gradle"
        fi

        if [ -f "keystore.properties" ]; then
          echo "使用签名配置构建..."
          $GRADLE_CMD assembleRelease --stacktrace
        else
          echo "⚠️ 未配置签名，构建调试版APK..."
          $GRADLE_CMD assembleDebug --stacktrace || true
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          fi
        fi

    - name: 重命名APK
      if: steps.check_gradle.outputs.has_gradle == 'true'
      run: |
        mkdir -p app/build/outputs/apk/release
        cd app/build/outputs/apk/release
        if [ -f "app-release.apk" ]; then
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${REF_NAME#v}"
          fi
          mv app-release.apk "compassor-v${VERSION}.apk"
          echo "APK_NAME=compassor-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        fi

    - name: 生成变更日志
      if: steps.check_gradle.outputs.has_gradle == 'true' && env.APK_NAME != ''
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "## 🚀 Release v${{ env.VERSION }}" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### 📱 应用信息" >> $GITHUB_OUTPUT
        echo "- **版本号**: ${{ env.VERSION }}" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "### 📥 安装说明" >> $GITHUB_OUTPUT
        echo "1. 下载 APK 文件" >> $GITHUB_OUTPUT
        echo "2. 在设备上启用未知来源安装" >> $GITHUB_OUTPUT
        echo "3. 安装并运行" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: 创建GitHub Release
      uses: softprops/action-gh-release@v1
      if: steps.check_gradle.outputs.has_gradle == 'true' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && env.APK_NAME != ''
      with:
        files: app/build/outputs/apk/release/${{ env.APK_NAME }}
        body: ${{ steps.changelog.outputs.CHANGELOG }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传Release APK
      uses: actions/upload-artifact@v4
      if: steps.check_gradle.outputs.has_gradle == 'true' && env.APK_NAME != ''
      with:
        name: release-apk
        path: app/build/outputs/apk/release/${{ env.APK_NAME }}

    - name: 构建完成通知
      if: steps.check_gradle.outputs.has_gradle == 'true'
      run: |
        echo "🎉 发布版本构建完成！"
        echo "🏷️  版本: ${{ env.VERSION }}"
        if [ -f "keystore.properties" ]; then
          echo "✅ 签名: 已签名"
        else
          echo "⚠️  签名: 未签名（请配置GitHub Secrets）"
        fi
